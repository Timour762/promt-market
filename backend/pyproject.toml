[project]
name = "promt-market-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.29,<1", "alembic>=1.14,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
