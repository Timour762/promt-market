services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promt
      POSTGRES_DB: promt_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promt -d promt_market"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: ../backend
    env_file: .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8107/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  mail-worker:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.mail_worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8107
      AUTH_ALLOWED_ORIGINS: ${PUBLIC_WEB_URL:?Set your HTTPS origin}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?Set a private proxy secret}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3107/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set your domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
